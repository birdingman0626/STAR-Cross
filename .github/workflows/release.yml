name: Release

on:
  push:
    tags: ['v*', '[0-9a-f]*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional release tag. Leave blank to use the commit hash.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  qualification:
    uses: ./.github/workflows/build.yml
  # Core platforms with reliable hosted runners. These gate the release.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: STAR-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: STAR-linux-aarch64
          - os: macos-15          # Apple Silicon (arm64)
            asset: STAR-macos-aarch64
          - os: macos-15-intel
            asset: STAR-macos-x86_64
          - os: windows-latest
            asset: STAR-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify native Linux architecture
        if: startsWith(matrix.os, 'ubuntu')
        run: test "STAR-linux-$(uname -m)" = "${{ matrix.asset }}"

      # Linux
      - name: Install dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        timeout-minutes: 10
        run: |
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          timeout 180s sudo apt-get "${apt_options[@]}" update --error-on=any
          timeout 300s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends zlib1g-dev ninja-build
      - name: Build (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          cd source
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTAR_BUILD_TESTS=ON
          cmake --build build --parallel 4
      - name: Unit tests (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: ctest --test-dir source/build --no-tests=error --output-on-failure -j4
      - name: Package (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: cp source/build/STAR "${{ matrix.asset }}" && chmod +x "${{ matrix.asset }}"
      - name: Smoke test (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: test "$(./${{ matrix.asset }} --version)" = "STAR-Cross $(git rev-parse --short HEAD)"

      # macOS (arm64)
      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install gcc ninja
          GCC_BIN=$(ls $(brew --prefix gcc)/bin/g++-* | sort -V | tail -1)
          GCC_VER=$(basename "$GCC_BIN" | grep -oE '[0-9]+$')
          echo "GCC_BIN=${GCC_BIN}"       >> $GITHUB_ENV
          echo "GCC_C_BIN=$(brew --prefix gcc)/bin/gcc-${GCC_VER}" >> $GITHUB_ENV
      - name: Build (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          cd source
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${GCC_C_BIN}" -DCMAKE_CXX_COMPILER="${GCC_BIN}" \
            -DSTAR_BUILD_TESTS=ON
          cmake --build build --parallel 4
      - name: Unit tests (macOS)
        if: startsWith(matrix.os, 'macos')
        run: ctest --test-dir source/build --no-tests=error --output-on-failure -j4
      - name: Package (macOS)
        if: startsWith(matrix.os, 'macos')
        run: cp source/build/STAR "${{ matrix.asset }}" && chmod +x "${{ matrix.asset }}"
      - name: Smoke test (macOS)
        if: startsWith(matrix.os, 'macos')
        run: test "$(./${{ matrix.asset }} --version)" = "STAR-Cross $(git rev-parse --short HEAD)"

      # Windows
      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd source
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTAR_BUILD_TESTS=ON
          cmake --build build --parallel 4
      - name: Unit tests (Windows)
        if: matrix.os == 'windows-latest'
        run: ctest --test-dir source/build --no-tests=error --output-on-failure -j4
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item source\build\STAR.exe staging\
          cmake --install source/build --config Release --component STAR --prefix release-metadata
          Copy-Item release-metadata/share/STAR-Cross/licenses staging/licenses -Recurse
          $redistDir = $env:VCToolsRedistDir
          if (-not $redistDir) { throw "MSVC redist directory missing" }
          if ($redistDir) {
            $crtDir = Get-ChildItem (Join-Path $redistDir "x64") -Filter "Microsoft.VC*.CRT" |
                      Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
            if ($crtDir -and (Test-Path $crtDir)) {
              foreach ($dll in @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")) {
                Copy-Item "$crtDir\$dll" staging\ -ErrorAction Stop
              }
            }
            $ompDll = Get-ChildItem "$redistDir\x64" -Recurse -Filter "vcomp*.dll" -ErrorAction SilentlyContinue |
                      Sort-Object Name -Descending | Select-Object -First 1
            if (-not $crtDir -or -not $ompDll) { throw "Required runtime directory/DLL missing" }
            Copy-Item $ompDll.FullName staging\
          }
          Compress-Archive -Path staging\* -DestinationPath "${{ matrix.asset }}.zip"
      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = & staging\STAR.exe --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "STAR-Cross $(git rev-parse --short HEAD)") {
            throw "Binary version does not match the workflow commit"
          }

      - name: Package Unix binary
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cmake --install source/build --config Release --component STAR --prefix release-metadata
          tar -czf "${{ matrix.asset }}.tar.gz" -C release-metadata/bin STAR -C "$PWD/release-metadata/share/STAR-Cross" licenses

      - name: Native alignment and embedded-server integration
        shell: bash
        run: |
          star=source/build/STAR
          if [ "${{ matrix.os }}" = "windows-latest" ]; then star=source/build/STAR.exe; fi
          python scripts/test_cpu_upstream.py --star-exe "$star" --sa-sparse 3
          python scripts/test_webui.py --star-exe "$star"

      - name: Upload artifact (unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
      - name: Upload artifact (windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  # Publish only after every supported release target passes.
  release:
    needs: [build, bigendian, qualification]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: STAR-*
          merge-multiple: true
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi
      - name: Create / update GitHub Release (all platforms)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          name: STAR-Cross ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            STAR-linux-x86_64.tar.gz
            STAR-linux-aarch64.tar.gz
            STAR-macos-aarch64.tar.gz
            STAR-macos-x86_64.tar.gz
            STAR-linux-s390x.tar.gz
            STAR-windows-x86_64.zip

  # Big-endian (s390x) via QEMU emulation. Also runs the big-endian code path
  # (--version + tiny genomeGenerate) to validate the byteOrder fix.
  bigendian:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU (s390x)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: s390x
      - name: Build + validate STAR on s390x (big-endian)
        run: |
          docker run --rm --platform linux/s390x -v "$PWD":/src -w /src \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            debian:trixie bash -c 'bash extras/tests/scripts/build_validate_s390x.sh && ./source/build/STAR --version > s390x-version.txt && cmake --install source/build --config Release --component STAR --prefix /src/release-metadata'
          cp source/build/STAR STAR-linux-s390x
          tar -czf STAR-linux-s390x.tar.gz -C release-metadata/bin STAR -C "$PWD/release-metadata/share/STAR-Cross" licenses
          chmod +x STAR-linux-s390x
          test "$(cat s390x-version.txt)" = "STAR-Cross $(git rev-parse --short HEAD)"
      - name: Upload s390x artifact
        uses: actions/upload-artifact@v7
        with:
          name: STAR-linux-s390x
          path: STAR-linux-s390x.tar.gz
          if-no-files-found: error
