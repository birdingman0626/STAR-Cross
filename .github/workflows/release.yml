name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.0.1). Leave blank to auto-generate from commit hash.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # Core platforms with reliable hosted runners. These gate the release.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: STAR-linux-x86_64
          - os: macos-15          # Apple Silicon (arm64)
            asset: STAR-macos-aarch64
          - os: macos-15-intel
            asset: STAR-macos-x86_64
          - os: windows-latest
            asset: STAR-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Linux
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev ninja-build
      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd source
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTAR_BUILD_TESTS=ON
          cmake --build build --parallel 4
      - name: Unit tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ctest --test-dir source/build/test --no-tests=error --output-on-failure -j4
      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cp source/build/STAR "${{ matrix.asset }}" && chmod +x "${{ matrix.asset }}"
      - name: Smoke test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ./${{ matrix.asset }} --version

      # macOS (arm64)
      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install gcc ninja
          GCC_BIN=$(ls $(brew --prefix gcc)/bin/g++-* | sort -V | tail -1)
          GCC_VER=$(basename "$GCC_BIN" | grep -oE '[0-9]+$')
          echo "GCC_BIN=${GCC_BIN}"       >> $GITHUB_ENV
          echo "GCC_C_BIN=$(brew --prefix gcc)/bin/gcc-${GCC_VER}" >> $GITHUB_ENV
      - name: Build (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          cd source
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${GCC_C_BIN}" -DCMAKE_CXX_COMPILER="${GCC_BIN}" \
            -DSTAR_BUILD_TESTS=ON
          cmake --build build --parallel 4
      - name: Unit tests (macOS)
        if: startsWith(matrix.os, 'macos')
        run: ctest --test-dir source/build/test --no-tests=error --output-on-failure -j4
      - name: Package (macOS)
        if: startsWith(matrix.os, 'macos')
        run: cp source/build/STAR "${{ matrix.asset }}" && chmod +x "${{ matrix.asset }}"
      - name: Smoke test (macOS)
        if: startsWith(matrix.os, 'macos')
        run: ./${{ matrix.asset }} --version

      # Windows
      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd source
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTAR_BUILD_TESTS=ON
          cmake --build build --parallel 4
      - name: Unit tests (Windows)
        if: matrix.os == 'windows-latest'
        run: ctest --test-dir source/build/test --no-tests=error --output-on-failure -j4
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item source\build\STAR.exe staging\
          Copy-Item LICENSE staging\
          $redistDir = $env:VCToolsRedistDir
          if (-not $redistDir) { throw "MSVC redist directory missing" }
          if ($redistDir) {
            $crtDir = Get-ChildItem (Join-Path $redistDir "x64") -Filter "Microsoft.VC*.CRT" |
                      Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
            if ($crtDir -and (Test-Path $crtDir)) {
              foreach ($dll in @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")) {
                Copy-Item "$crtDir\$dll" staging\ -ErrorAction Stop
              }
            }
            $ompDll = Get-ChildItem "$redistDir\x64" -Recurse -Filter "vcomp*.dll" -ErrorAction SilentlyContinue |
                      Sort-Object Name -Descending | Select-Object -First 1
            if (-not $crtDir -or -not $ompDll) { throw "Required runtime directory/DLL missing" }
            Copy-Item $ompDll.FullName staging\
          }
          Compress-Archive -Path staging\* -DestinationPath "${{ matrix.asset }}.zip"
      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        run: staging\STAR.exe --version

      - name: Upload artifact (unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Upload artifact (windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  # Publish only after every supported release target passes.
  release:
    needs: [build, bigendian]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=0.0.1_$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi
      - name: Create / update GitHub Release (all platforms)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          name: STAR-Cross ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            STAR-linux-x86_64
            STAR-macos-aarch64
            STAR-macos-x86_64
            STAR-linux-s390x
            STAR-windows-x86_64.zip
            LICENSE

  # Big-endian (s390x) via QEMU emulation. Also runs the big-endian code path
  # (--version + tiny genomeGenerate) to validate the byteOrder fix.
  bigendian:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU (s390x)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x
      - name: Build + validate STAR on s390x (big-endian)
        run: |
          docker run --rm --platform linux/s390x -v "$PWD":/src -w /src \
            debian:bookworm bash extras/tests/scripts/build_validate_s390x.sh
          cp source/build/STAR STAR-linux-s390x
          chmod +x STAR-linux-s390x
      - name: Upload s390x artifact
        uses: actions/upload-artifact@v7
        with:
          name: STAR-linux-s390x
          path: STAR-linux-s390x
          if-no-files-found: error
